name: Core CI Quality & Smoke Gate

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - 'release/v*'
      - 'hotfix/v*'
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Stage 1: Validate (Lockfile Integrity, Shell/Compose Syntax, Diff Guard & Scope)
  # ============================================================================
  validate:
    name: Validate, Lockfiles & Diff Guard
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.changes.outputs.backend_changed }}
      frontend_changed: ${{ steps.changes.outputs.frontend_changed }}
      db_changed: ${{ steps.changes.outputs.db_changed }}
      is_integration_ref: ${{ steps.changes.outputs.is_integration_ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify Fixed Lockfiles (root, backend, frontend)
        run: node scripts/ci/check-lockfiles.mjs --report reports/lockfile-report.json

      - name: Install Root Dependencies (Fixed Lockfile)
        run: npm ci

      - name: Validate Shell Scripts, CI Scripts & Docker Compose Configs
        run: bash scripts/ci/validate-configs.sh

      - name: Run Anti-AI-Deception & Diff Quality Guard
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="${PR_BASE_SHA:-${BEFORE_SHA:-}}"
          node scripts/ci/guard-diff.mjs --enforce-feature-test --base "$BASE_SHA" --head "$GITHUB_SHA"

      - name: Detect Changed Scopes & Integration Ref
        id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Nhánh tích hợp (main, develop, release/*, hotfix/*, tag v*): Luôn chạy full test không lọc theo diff
          is_integration="false"
          if [ "$EVENT_NAME" != "pull_request" ]; then
            case "$REF_NAME" in
              main|master|develop|release/v*|hotfix/v*|v*.*.*)
                is_integration="true"
                ;;
            esac
          fi

          base_sha="${PR_BASE_SHA:-${BEFORE_SHA:-}}"
          zero_sha="0000000000000000000000000000000000000000"
          if [ -z "$base_sha" ] || [ "$base_sha" = "$zero_sha" ]; then
            if git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
              base_sha="$(git rev-parse "${GITHUB_SHA}^")"
            else
              base_sha="$(git hash-object -t tree /dev/null)"
            fi
          fi

          git diff --name-only --diff-filter=ACMRD "$base_sha" "$GITHUB_SHA" > /tmp/changed-files

          backend_changed="false"
          frontend_changed="false"
          db_changed="false"

          while IFS= read -r file; do
            case "$file" in
              backend/*|scripts/ci/*|.github/workflows/ci.yml|.gitlab-ci.yml|package.json|package-lock.json)
                backend_changed="true"
                ;;
            esac
            case "$file" in
              frontend/*|scripts/ci/*|.github/workflows/ci.yml|.gitlab-ci.yml|package.json|package-lock.json)
                frontend_changed="true"
                ;;
            esac
            case "$file" in
              backend/src/database/*|backend/src/packages/database/*|backend/src/*/migrations/*|backend/src/*/seeders/*|backend/src/*/module.manifest.json|backend/project.manifest.json|.github/workflows/ci.yml|.gitlab-ci.yml)
                db_changed="true"
                ;;
            esac
          done < /tmp/changed-files

          echo "is_integration_ref=$is_integration" >> "$GITHUB_OUTPUT"
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "db_changed=$db_changed" >> "$GITHUB_OUTPUT"

          echo "Scope Summary: is_integration=$is_integration | backend=$backend_changed | frontend=$frontend_changed | db=$db_changed"

      - name: Upload Lockfile Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-lockfile
          path: reports/lockfile-report.json
          if-no-files-found: ignore

  # ============================================================================
  # Stage 2a: Backend Quality, Architecture, API Diff, Unit & Feature Tests
  # ============================================================================
  backend-test:
    name: Backend Quality, Arch, API Diff & Unit/Feature Tests
    needs: validate
    if: needs.validate.outputs.backend_changed == 'true' || needs.validate.outputs.is_integration_ref == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with base history for OpenAPI diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies (Fixed Lockfile)
        working-directory: backend
        run: npm ci

      - name: Check Formatting (Prettier)
        working-directory: backend
        run: npm run format:check

      - name: Check Code Quality (ESLint)
        working-directory: backend
        run: npm run lint:check

      - name: TypeScript Type Check
        working-directory: backend
        run: npm run typecheck

      - name: Build Backend (ESM + tsc-alias)
        working-directory: backend
        run: npm run build

      - name: Run Architecture Boundary Tests (arch:check)
        working-directory: backend
        env:
          APP_NAME: core-ci
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '3005'
          API_PREFIX: api/v1
          DB_ENABLED: 'false'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '1'
          REDIS_PREFIX: 'core_ci:'
          STORAGE_DRIVER: local
          JWT_ACCESS_SECRET: ci_test_access_secret_key_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_at_least_32_characters_long
          JWT_ACCESS_EXPIRATION: 15m
          JWT_REFRESH_EXPIRATION: 7d
        run: npm run cli -- arch:check --report ../reports/arch-report.json

      - name: Check API Breaking Changes against Base OpenAPI
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          APP_NAME: core-ci
          NODE_ENV: test
          HOST: 127.0.0.1
          PORT: '3005'
          API_PREFIX: api/v1
          DB_ENABLED: 'false'
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '1'
          REDIS_PREFIX: 'core_ci:'
          STORAGE_DRIVER: local
          JWT_ACCESS_SECRET: ci_test_access_secret_key_at_least_32_characters_long
          JWT_REFRESH_SECRET: ci_test_refresh_secret_key_at_least_32_characters_long
          JWT_ACCESS_EXPIRATION: 15m
          JWT_REFRESH_EXPIRATION: 7d
        run: node scripts/ci/check-api-changes.mjs --report reports/openapi-report.json

      - name: Run Unit, Integration (Mock) & Feature/API Tests with Module Coverage
        working-directory: backend
        run: npm run test:cov:module

      - name: Upload Backend Quality Reports & Coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-report-backend
          path: |
            reports/arch-report.json
            reports/openapi-report.json
            backend/coverage/module-coverage-summary.json
            backend/coverage/module-coverage-report.md
          if-no-files-found: ignore

  # ============================================================================
  # Stage 2b: Frontend Basic Quality (Lockfile, Lint, Typecheck, Vitest, Build)
  # ============================================================================
  frontend-test:
    name: Frontend Quality, Typecheck, Vitest & Build
    needs: validate
    if: needs.validate.outputs.frontend_changed == 'true' || needs.validate.outputs.is_integration_ref == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies (Fixed Lockfile)
        working-directory: frontend
        run: npm ci

      - name: Run Oxlint & Hardcode Gate (Theme / i18n)
        working-directory: frontend
        run: npm run lint

      - name: TypeScript Type Check
        working-directory: frontend
        run: npm run typecheck

      - name: Run Vitest Suite
        working-directory: frontend
        run: npm run test

      - name: Build Production Bundle (tsc -b + vite build)
        working-directory: frontend
        run: npm run build

  # ============================================================================
  # Stage 2c: Backend Integration & API Tests with Real PostgreSQL + Redis
  # ============================================================================
  backend-integration-api-test:
    name: Backend Integration & API Tests (Postgres 16 + Redis 7)
    needs: validate
    if: needs.validate.outputs.backend_changed == 'true' || needs.validate.outputs.db_changed == 'true' || needs.validate.outputs.is_integration_ref == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: core_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw
          --health-cmd="pg_isready -U test_user -d core_test"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
    env:
      NODE_ENV: development
      APP_NAME: core-ci
      HOST: 127.0.0.1
      PORT: 3005
      API_PREFIX: api/v1
      DB_ENABLED: 'true'
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: core_test
      DB_USERNAME: test_user
      DB_PASSWORD: test_password
      OPS_DATABASE_MIGRATIONS_ENABLED: 'true'
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: '6379'
      REDIS_PREFIX: 'core_ci:'
      STORAGE_DRIVER: local
      JWT_ACCESS_SECRET: ci_test_access_secret_key_at_least_32_characters_long
      JWT_REFRESH_SECRET: ci_test_refresh_secret_key_at_least_32_characters_long
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install & Build Backend (Fixed Lockfile)
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Execute Database Migrations (migration:check --run)
        working-directory: backend
        run: npm run cli -- migration:check --run

      - name: Execute Seeders Run #1 (Fresh DB)
        working-directory: backend
        run: npm run cli -- seed:run

      - name: Execute Seeders Run #2 (Verify Idempotency)
        working-directory: backend
        run: npm run cli -- seed:run

      - name: Run Live Integration & API Tests (Real DB + Redis)
        working-directory: backend
        env:
          NODE_ENV: test
          OPS_DATABASE_MIGRATIONS_ENABLED: 'false'
        run: npm run test:integration:live

  # ============================================================================
  # Stage 3: Docker Multi-Runtime Smoke Test (Chỉ chạy trên nhánh tích hợp develop/main/release)
  # ============================================================================
  docker-smoke-test:
    name: Docker Production Build & Smoke Test
    needs:
      - validate
      - backend-test
      - frontend-test
      - backend-integration-api-test
    if: |
      always() &&
      needs.validate.outputs.is_integration_ref == 'true' &&
      (needs.backend-test.result == 'success' || needs.backend-test.result == 'skipped') &&
      (needs.frontend-test.result == 'success' || needs.frontend-test.result == 'skipped') &&
      (needs.backend-integration-api-test.result == 'success' || needs.backend-integration-api-test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Production Env & Boot Stack (with Ephemeral Redis)
        run: |
          cp .env.docker.prod.example .env.docker.prod
          sed -i 's/^DB_ENABLED=.*/DB_ENABLED=false/' .env.docker.prod
          sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env.docker.prod
          sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env.docker.prod
          sed -i 's/^STORAGE_DRIVER=.*/STORAGE_DRIVER=local/' .env.docker.prod
          sed -i 's/^STORAGE_ALLOW_LOCAL_IN_PRODUCTION=.*/STORAGE_ALLOW_LOCAL_IN_PRODUCTION=true/' .env.docker.prod
          sed -i 's|^STORAGE_LOCAL_PATH=.*|STORAGE_LOCAL_PATH=/tmp/core-smoke-uploads|' .env.docker.prod
          cat <<'EOF' > /tmp/ci-smoke-redis.yml
          services:
            redis:
              image: redis:7-alpine
              container_name: core-redis-ci-smoke
              networks:
                - core_prod_net
              healthcheck:
                test: ["CMD", "redis-cli", "ping"]
                interval: 3s
                timeout: 3s
                retries: 15
          EOF
          docker compose -f docker-compose.prod.yml -f /tmp/ci-smoke-redis.yml up -d --build

      - name: Run Multi-Runtime Smoke Test (API, Worker, Scheduler, Nginx, Prometheus)
        run: bash ./docker/smoke-test.sh prod

      - name: Tear Down Docker Stack
        if: always()
        run: |
          docker compose -f docker-compose.prod.yml -f /tmp/ci-smoke-redis.yml logs --tail=50 || true
          docker compose -f docker-compose.prod.yml -f /tmp/ci-smoke-redis.yml down -v --remove-orphans || true
          rm -f /tmp/ci-smoke-redis.yml .env.docker.prod

  # ============================================================================
  # Stage 4: Aggregated CI Quality Report (Step Summary + Downloadable Artifact)
  # ============================================================================
  ci-report:
    name: CI Quality Summary Report
    needs:
      - validate
      - backend-test
      - frontend-test
      - backend-integration-api-test
      - docker-smoke-test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download Quality Report Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: downloaded-reports

      - name: Generate CI Summary (Markdown, JSON & Excel .xlsx)
        run: |
          node scripts/ci/ci-report.mjs --summarize --no-fail \
            --step "Validate, Lockfiles & Diff Guard=${{ needs.validate.result }}" \
            --step "Backend Quality, Arch, API Diff & Unit/Feature Tests=${{ needs.backend-test.result }}" \
            --step "Backend Integration & API Tests (Postgres + Redis)=${{ needs.backend-integration-api-test.result }}" \
            --step "Frontend Quality, Typecheck & Build=${{ needs.frontend-test.result }}" \
            --step "Docker Multi-Runtime Smoke Test=${{ needs.docker-smoke-test.result }}" \
            --search-dir downloaded-reports \
            --out-dir reports

      - name: Upload Aggregated CI Report (Markdown, JSON & Excel)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-summary-report
          path: |
            reports/ci-summary.md
            reports/ci-summary.json
            reports/ci-summary.xlsx
          if-no-files-found: ignore
