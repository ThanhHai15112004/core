stages:
  - validate
  - test
  - security
  - smoke
  - build_release
  - deploy
  - report

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
    - when: never

default:
  interruptible: true
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

# Branch tích hợp: chạy full test, không lọc theo diff.
# Merge dồn khiến pipeline cũ bị auto-cancel, nên diff của commit cuối
# không phản ánh hết những gì đã vào nhánh.
.integration-refs:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_BRANCH =~ /^(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+$/'
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'

# ==============================================================================
# Stage 1: Validate (Lockfile Integrity, Shell/Compose Syntax & Anti-AI-Deception Guard)
# ==============================================================================
validate-and-guard:
  image: node:22-alpine
  stage: validate
  variables:
    GIT_DEPTH: "0"
    npm_config_cache: "$CI_PROJECT_DIR/.npm-root"
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-root/
  before_script:
    - apk add --no-cache bash git docker-cli docker-cli-compose
  script:
    - node scripts/ci/check-lockfiles.mjs --report reports/lockfile-report.json
    - npm ci
    - bash scripts/ci/validate-configs.sh
    - node scripts/ci/guard-diff.mjs --enforce-feature-test
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/lockfile-report.json

# ==============================================================================
# Stage 2a: Backend Quality, Architecture, API Diff & Unit/Feature Tests
# ==============================================================================
backend-test:
  image: node:22-alpine
  stage: test
  rules:
    - !reference [.integration-refs, rules]
    - changes:
        - backend/**/*
        - scripts/ci/**/*
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
  variables:
    GIT_DEPTH: "0"
    npm_config_cache: "$CI_PROJECT_DIR/.npm-backend"
  before_script:
    - apk add --no-cache git
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm-backend/
  script:
    - cd backend
    - npm ci
    - mkdir -p ../reports
    - cd ..
    - node scripts/ci/collect-ci-findings.mjs --capture prettier --cwd backend --out reports/prettier-report.json -- npx prettier --list-different "src/**/*.ts" "test/**/*.ts"
    - cd backend
    - npx eslint "{src,test}/**/*.ts" -f json -o ../reports/eslint-report.json || ESLINT_RC=$?
    - npx eslint "{src,test}/**/*.ts"
    - test "${ESLINT_RC:-0}" -eq 0
    - cd ..
    - node scripts/ci/collect-ci-findings.mjs --capture tsc-be --cwd backend --out reports/typecheck-be-report.json -- npx tsc --noEmit -p tsconfig.json
    - cd backend
    - npm run build
    - >
      APP_NAME=core-ci NODE_ENV=test HOST=127.0.0.1 PORT=3005 API_PREFIX=api/v1
      DB_ENABLED=false REDIS_HOST=127.0.0.1 REDIS_PORT=1 REDIS_PREFIX=core_ci:
      STORAGE_DRIVER=local
      JWT_ACCESS_SECRET=ci_test_access_secret_key_at_least_32_characters_long
      JWT_REFRESH_SECRET=ci_test_refresh_secret_key_at_least_32_characters_long
      JWT_ACCESS_EXPIRATION=15m JWT_REFRESH_EXPIRATION=7d
      npm run cli -- arch:check --report ../reports/arch-report.json
    - cd ..
    - >
      APP_NAME=core-ci NODE_ENV=test HOST=127.0.0.1 PORT=3005 API_PREFIX=api/v1
      DB_ENABLED=false REDIS_HOST=127.0.0.1 REDIS_PORT=1 REDIS_PREFIX=core_ci:
      STORAGE_DRIVER=local
      JWT_ACCESS_SECRET=ci_test_access_secret_key_at_least_32_characters_long
      JWT_REFRESH_SECRET=ci_test_refresh_secret_key_at_least_32_characters_long
      JWT_ACCESS_EXPIRATION=15m JWT_REFRESH_EXPIRATION=7d
      node scripts/ci/check-api-changes.mjs --report reports/openapi-report.json
    - cd backend
    - NODE_OPTIONS="--experimental-vm-modules --max-old-space-size=4096" npx jest --coverage --testPathIgnorePatterns="live-db-redis-api\.integration-spec\.ts" --maxWorkers=2 --workerIdleMemoryLimit=512MB --forceExit --json --outputFile=../reports/jest-results.json
    - node scripts/report-module-coverage.mjs
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/prettier-report.json
      - reports/eslint-report.json
      - reports/typecheck-be-report.json
      - reports/arch-report.json
      - reports/openapi-report.json
      - reports/jest-results.json
      - backend/coverage/module-coverage-summary.json
      - backend/coverage/module-coverage-report.md

# ==============================================================================
# Stage 2b: Frontend Basic Quality (Lockfile, Oxlint, Typecheck, Vitest & Build)
# ==============================================================================
frontend-test:
  image: node:22-alpine
  stage: test
  rules:
    - !reference [.integration-refs, rules]
    - changes:
        - frontend/**/*
        - scripts/ci/**/*
        - package.json
        - package-lock.json
        - .gitlab-ci.yml
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-frontend"
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - .npm-frontend/
  script:
    - cd frontend
    - npm ci
    - cd ..
    - node scripts/ci/collect-ci-findings.mjs --capture fe-oxlint --cwd frontend --out reports/fe-oxlint-report.json -- npx oxlint --format json
    - node scripts/ci/collect-ci-findings.mjs --capture fe-hardcode --cwd frontend --out reports/fe-hardcode-report.json -- node scripts/check-hardcode.mjs
    - node scripts/ci/collect-ci-findings.mjs --capture tsc-fe --cwd frontend --out reports/typecheck-fe-report.json -- npx tsc -b --noEmit
    - cd frontend
    - mkdir -p ../reports
    - npx vitest run --reporter=default --reporter=json --outputFile=../reports/vitest-results.json
    - npm run build
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/fe-oxlint-report.json
      - reports/fe-hardcode-report.json
      - reports/typecheck-fe-report.json
      - reports/vitest-results.json

# ==============================================================================
# Stage 2c: Backend Integration & API Tests with Real PostgreSQL 16 + Redis 7
# ==============================================================================
backend-integration-api-test:
  image: node:22-alpine
  stage: test
  services:
    - name: postgres:16-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis
  rules:
    - !reference [.integration-refs, rules]
    - changes:
        - backend/**/*
        - scripts/ci/**/*
        - .gitlab-ci.yml
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm-backend"
    POSTGRES_DB: core_test
    POSTGRES_USER: test_user
    POSTGRES_PASSWORD: test_password
    NODE_ENV: development
    APP_NAME: core-ci
    HOST: 127.0.0.1
    PORT: "3005"
    API_PREFIX: api/v1
    DB_ENABLED: "true"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: core_test
    DB_USERNAME: test_user
    DB_PASSWORD: test_password
    OPS_DATABASE_MIGRATIONS_ENABLED: "true"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PREFIX: "core_ci:"
    STORAGE_DRIVER: local
    JWT_ACCESS_SECRET: ci_test_access_secret_key_at_least_32_characters_long
    JWT_REFRESH_SECRET: ci_test_refresh_secret_key_at_least_32_characters_long
    JWT_ACCESS_EXPIRATION: "15m"
    JWT_REFRESH_EXPIRATION: "7d"
  cache:
    key:
      files:
        - backend/package-lock.json
    paths:
      - .npm-backend/
  script:
    - cd backend
    - npm ci
    - npm run build
    - npm run cli -- migration:check --run
    - npm run cli -- seed:run
    - npm run cli -- seed:run
    - NODE_ENV=test OPS_DATABASE_MIGRATIONS_ENABLED=false TEST_USE_REAL_INFRA=true NODE_OPTIONS="--experimental-vm-modules --max-old-space-size=4096" npx jest --testPathPattern="live-db-redis-api\.integration-spec\.ts" --runInBand --forceExit --json --outputFile=../reports/jest-live-results.json
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/jest-live-results.json

# ==============================================================================
# Stage 3: Docker Production Smoke Test (Chỉ chạy trên nhánh tích hợp develop/main/release)
# ==============================================================================
docker-smoke-test:
  image: docker:27-cli
  stage: smoke
  services:
    - name: docker:27-dind
  rules:
    - !reference [.integration-refs, rules]
  needs:
    - job: validate-and-guard
    - job: backend-test
      optional: true
    - job: frontend-test
      optional: true
    - job: backend-integration-api-test
      optional: true
  before_script:
    - apk add --no-cache bash curl
    - docker info
  script:
    - cp .env.docker.prod.example .env.docker.prod
    - sed -i 's/^DB_ENABLED=.*/DB_ENABLED=false/' .env.docker.prod
    - sed -i 's/^REDIS_HOST=.*/REDIS_HOST=redis/' .env.docker.prod
    - sed -i 's/^REDIS_PASSWORD=.*/REDIS_PASSWORD=/' .env.docker.prod
    - sed -i 's/^STORAGE_DRIVER=.*/STORAGE_DRIVER=local/' .env.docker.prod
    - sed -i 's/^STORAGE_ALLOW_LOCAL_IN_PRODUCTION=.*/STORAGE_ALLOW_LOCAL_IN_PRODUCTION=true/' .env.docker.prod
    - sed -i 's|^STORAGE_LOCAL_PATH=.*|STORAGE_LOCAL_PATH=/tmp/core-smoke-uploads|' .env.docker.prod
    - |
      cat <<'EOF' > /tmp/ci-smoke-redis.yml
      services:
        redis:
          image: redis:7-alpine
          container_name: core-redis-ci-smoke
          networks:
            - core_prod_net
      EOF
    - docker compose -f docker-compose.prod.yml -f /tmp/ci-smoke-redis.yml up -d --build
    - bash ./docker/smoke-test.sh prod
  after_script:
    - docker compose -f docker-compose.prod.yml -f /tmp/ci-smoke-redis.yml down -v --remove-orphans >/dev/null 2>&1 || true
    - rm -f /tmp/ci-smoke-redis.yml .env.docker.prod

# ==============================================================================
# Stage 2d: Automated Security Scanning (15.2: Secrets, Deps/SLA, SAST, IaC, License & SBOM)
# ==============================================================================
security-scan:
  image: node:22-alpine
  stage: security
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache bash git
  script:
    - node scripts/security/scan-secrets.mjs --all --report reports/security-secrets-report.json --sarif reports/security-secrets.sarif
    - node scripts/security/scan-dependencies.mjs --strict-network --report reports/security-deps-report.json --sarif reports/security-deps.sarif
    - node scripts/security/scan-sast.mjs --report reports/security-sast-report.json --sarif reports/security-sast.sarif
    - node scripts/security/scan-iac.mjs --report reports/security-iac-report.json --sarif reports/security-iac.sarif
    - node scripts/security/check-licenses.mjs --report reports/security-license-report.json --sarif reports/security-license.sarif
    - node scripts/security/generate-sbom.mjs --out-dir reports/sbom --report reports/security-sbom-report.json
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - reports/security-*.json
      - reports/security-*.sarif
      - reports/sbom/

# ==============================================================================
# Stage 3b: Docker Image Security Scan & Image SBOM (Nhánh tích hợp / Release)
# ==============================================================================
docker-image-security-scan:
  image: docker:27-cli
  stage: smoke
  services:
    - name: docker:27-dind
  rules:
    - !reference [.integration-refs, rules]
  before_script:
    - apk add --no-cache bash nodejs npm
    - docker info
  script:
    - bash scripts/security/scan-docker-images.sh
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - reports/security-docker-report.json
      - reports/trivy-image-*.json
      - reports/sbom/*-image.cdx.json

# ==============================================================================
# Stage 3c: Staging DAST API Security Scan (Manual / Scheduled)
# ==============================================================================
dast-staging:
  image: node:22-alpine
  stage: smoke
  rules:
    - if: '$STAGING_BASE_URL != null && $STAGING_BASE_URL != ""'
      when: manual
      allow_failure: true
  script:
    - node scripts/security/run-dast.mjs --target "$STAGING_BASE_URL" --report reports/security-dast-report.json --sarif reports/security-dast.sarif
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/security-dast-report.json
      - reports/security-dast.sarif

# ==============================================================================
# Stage 4: Build ONCE & Push Immutable Images to Container Registry (15.3)
# ==============================================================================
build-and-push-release:
  image: docker:27-cli
  stage: build_release
  services:
    - name: docker:27-dind
  rules:
    - if: '$CI_REGISTRY_IMAGE != null && $CI_REGISTRY_IMAGE != "" && ($CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+$/ || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'
  before_script:
    - apk add --no-cache bash nodejs
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - SHORT_SHA="${CI_COMMIT_SHORT_SHA}"
    - BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
    - PKG_VERSION="$(node -e "console.log(JSON.parse(require('fs').readFileSync('backend/package.json','utf8')).version || '1.0.0')")"
    - APP_VERSION="$(node -e "import('./scripts/deploy/release-manifest.mjs').then(m => console.log(m.deriveReleaseVersion({ gitRef: process.env.CI_COMMIT_TAG || process.env.CI_COMMIT_BRANCH, packageVersion: '${PKG_VERSION}', commitSha: '${CI_COMMIT_SHA}' })))")"
    - TAG="sha-${SHORT_SHA}"
    - |
      build_push() {
        local name="$1" dockerfile="$2"
        local repo="${CI_REGISTRY_IMAGE}/${name}"
        docker build -f "$dockerfile" \
          --build-arg "APP_VERSION=${APP_VERSION}" \
          --build-arg "APP_GIT_COMMIT=${CI_COMMIT_SHA}" \
          --build-arg "APP_BUILD_TIME=${BUILD_TIME}" \
          --build-arg "APP_IMAGE=${repo}:${APP_VERSION}" \
          --build-arg "APP_SOURCE_URL=${CI_PROJECT_URL}" \
          -t "${repo}:${TAG}" \
          -t "${repo}:${APP_VERSION}" .
        docker push "${repo}:${TAG}"
        docker push "${repo}:${APP_VERSION}"
        docker inspect --format='{{index .RepoDigests 0}}' "${repo}:${TAG}" | awk -F'@' '{print $2}'
      }
      BACKEND_DIGEST="$(build_push core-backend docker/backend/Dockerfile.prod)"
      FRONTEND_DIGEST="$(build_push core-frontend docker/frontend/Dockerfile.prod)"
      NGINX_DIGEST="$(build_push core-nginx docker/nginx/Dockerfile)"
      node scripts/deploy/release-manifest.mjs --create \
        --version "${APP_VERSION}" \
        --commit "${CI_COMMIT_SHA}" \
        --git-ref "${CI_COMMIT_REF_NAME}" \
        --built-at "${BUILD_TIME}" \
        --registry "${CI_REGISTRY}" \
        --namespace "${CI_PROJECT_PATH}" \
        --tag "${TAG}" \
        --source-url "${CI_PROJECT_URL}" \
        --backend-digest "${BACKEND_DIGEST}" \
        --frontend-digest "${FRONTEND_DIGEST}" \
        --nginx-digest "${NGINX_DIGEST}" \
        --out reports/release-manifest.json
      node scripts/deploy/release-manifest.mjs --validate reports/release-manifest.json --require-digest
  artifacts:
    expire_in: 90 days
    paths:
      - reports/release-manifest.json

# ==============================================================================
# Stage 5a: Tự động triển khai Development (sau khi merge develop)
# ==============================================================================
deploy-development:
  image: node:22-alpine
  stage: deploy
  needs:
    - job: build-and-push-release
      artifacts: true
  environment:
    name: development
    url: $DEV_BASE_URL
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" && $CI_REGISTRY_IMAGE != null && $CI_REGISTRY_IMAGE != ""'
  before_script:
    - apk add --no-cache bash
  script:
    - |
      if [ -z "${DEV_BASE_URL:-}" ]; then
        bash scripts/deploy/deploy.sh --env development --manifest reports/release-manifest.json --strategy "${DEV_DEPLOY_STRATEGY:-rolling}" --dry-run
      else
        bash scripts/deploy/deploy.sh --env development --manifest reports/release-manifest.json --strategy "${DEV_DEPLOY_STRATEGY:-rolling}" --base-url "${DEV_BASE_URL}"
      fi
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/deploy-smoke-development.json

# ==============================================================================
# Stage 5b: Tự động triển khai Staging (dùng nguyên artifact build-once)
# ==============================================================================
deploy-staging:
  image: node:22-alpine
  stage: deploy
  needs:
    - job: build-and-push-release
      artifacts: true
  environment:
    name: staging
    url: $STAGING_BASE_URL
  rules:
    - if: '$CI_REGISTRY_IMAGE != null && $CI_REGISTRY_IMAGE != "" && ($CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH || $CI_COMMIT_BRANCH =~ /^(release|hotfix)\/v[0-9]+\.[0-9]+\.[0-9]+$/ || $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/)'
  before_script:
    - apk add --no-cache bash
  script:
    - |
      if [ -z "${STAGING_BASE_URL:-}" ]; then
        bash scripts/deploy/deploy.sh --env staging --manifest reports/release-manifest.json --strategy "${STAGING_DEPLOY_STRATEGY:-rolling}" --require-digest --dry-run
      else
        bash scripts/deploy/deploy.sh --env staging --manifest reports/release-manifest.json --strategy "${STAGING_DEPLOY_STRATEGY:-rolling}" --base-url "${STAGING_BASE_URL}" --require-digest
      fi
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - reports/deploy-smoke-staging.json

# ==============================================================================
# Stage 5c: Triển khai Production (Yêu cầu phê duyệt manual — KHÔNG build lại)
# ==============================================================================
deploy-production:
  image: node:22-alpine
  stage: deploy
  needs:
    - job: build-and-push-release
      artifacts: true
    - job: deploy-staging
  environment:
    name: production
    url: $PRODUCTION_BASE_URL
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/ && $CI_REGISTRY_IMAGE != null && $CI_REGISTRY_IMAGE != ""'
      when: manual
  before_script:
    - apk add --no-cache bash
  script:
    - |
      if [ -z "${PRODUCTION_BASE_URL:-}" ]; then
        bash scripts/deploy/deploy.sh --env production --manifest reports/release-manifest.json --strategy "${PROD_DEPLOY_STRATEGY:-blue-green}" --require-digest --dry-run
      else
        bash scripts/deploy/deploy.sh --env production --manifest reports/release-manifest.json --strategy "${PROD_DEPLOY_STRATEGY:-blue-green}" --base-url "${PRODUCTION_BASE_URL}" --require-digest
      fi
  artifacts:
    when: always
    expire_in: 90 days
    paths:
      - reports/deploy-smoke-production.json

# ==============================================================================
# Stage 6: Aggregated CI Quality Report
# ==============================================================================
ci-report:
  image: node:22-alpine
  stage: report
  when: always
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  needs:
    - job: validate-and-guard
      artifacts: true
    - job: backend-test
      optional: true
      artifacts: true
    - job: frontend-test
      optional: true
      artifacts: true
    - job: backend-integration-api-test
      optional: true
      artifacts: true
    - job: security-scan
      optional: true
      artifacts: true
    - job: docker-image-security-scan
      optional: true
      artifacts: true
  script:
    - |
      node scripts/ci/ci-report.mjs --summarize --infer-from-artifacts --no-fail \
        --search-dir reports \
        --out-dir reports
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - reports/ci-summary.md
      - reports/ci-summary.json
      - reports/ci-summary.xlsx
