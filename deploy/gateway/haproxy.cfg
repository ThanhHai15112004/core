# ==============================================================================
# Core Framework — HAProxy Load Balancer Template (Phase 13.5)
# Đồng bộ với Backend:
#   - LB keep-alive (60s) < API_KEEP_ALIVE_TIMEOUT_MS (65s) < API_HEADERS_TIMEOUT_MS (70s)
#   - LB client/server timeout (60s) >= API_REQUEST_TIMEOUT_MS (30s)
#   - Max body size: 32MB (33554432 bytes) == API_MAX_BODY_SIZE_BYTES
# ==============================================================================

global
    log stdout format raw local0 info
    maxconn 4096
    tune.bufsize 32768

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor except 127.0.0.0/8
    option http-keep-alive
    option redispatch
    retries 2
    timeout connect 10s
    timeout client 60s
    timeout server 60s
    timeout http-keep-alive 60s
    timeout http-request 15s

frontend fe_http
    bind *:80
    # Chặn sớm payload > 32MB (33554432 bytes) đồng nhất với Backend
    acl body_too_large req.body_len gt 33554432
    http-request deny deny_status 413 if body_too_large

    # Gắn header ngữ cảnh proxy & marker Rate Limit tầng Edge
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http if !{ ssl_fc }
    http-request set-header X-Forwarded-Host %[req.hdr(Host)]
    http-request set-header X-Forwarded-Port %[dst_port]
    http-request set-header X-Request-Id %[uuid()] if !{ req.hdr(X-Request-Id) -m found }
    http-request set-header X-RateLimit-Source gateway

    # Health probes bỏ qua Edge Rate Limit
    acl is_health path_beg /api/v1/health
    acl is_metrics path /api/v1/metrics
    http-request deny deny_status 404 if is_metrics

    # Edge IP Rate Limit (30 req/s trung bình trong 10s = 300 req/10s)
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src if !is_health
    http-request deny deny_status 429 if !is_health { sc_http_req_rate(0) gt 300 }

    # Chuẩn bị routing khi tách microservice (giữ nguyên URL /api/v1/*):
    # acl is_identity path_beg /api/v1/auth /api/v1/users /api/v1/roles /api/v1/sessions /api/v1/mfa
    # acl is_files path_beg /api/v1/files
    # use_backend bk_identity if is_identity
    # use_backend bk_files if is_files

    default_backend bk_core_api

backend bk_core_api
    balance roundrobin
    option httpchk
    http-check send meth HEAD uri /api/v1/health/ready ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 10s fall 3 rise 2 slowstart 10s
    server api1 backend-1:3005 check
    server api2 backend-2:3005 check
