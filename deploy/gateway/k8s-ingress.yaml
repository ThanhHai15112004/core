# ==============================================================================
# Core Framework — Vendor-Neutral Kubernetes Ingress / Cloud LB Template
# Hỗ trợ cả NGINX Ingress Controller và Cloud Load Balancer (AWS ALB / GCP / Azure)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: core-api-gateway
  annotations:
    # --- NGINX Ingress Controller ---
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "10"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "32"
    nginx.ingress.kubernetes.io/upstream-keepalive-timeout: "60"
    nginx.ingress.kubernetes.io/limit-rps: "30"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "2"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header X-RateLimit-Source "gateway";
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;

    # --- Cloud LB / AWS ALB (bỏ comment khi dùng AWS Load Balancer Controller) ---
    # alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/target-type: ip
    # alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health/ready
    # alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    # alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    # alb.ingress.kubernetes.io/success-codes: "200"
    # alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=60
spec:
  ingressClassName: nginx
  rules:
    - host: api.example.com
      http:
        paths:
          # Giữ nguyên contract /api/v1/* khi tách service khỏi monolith
          - path: /api/v1/health
            pathType: Prefix
            backend:
              service:
                name: core-api
                port:
                  number: 3005
          - path: /api/v1/
            pathType: Prefix
            backend:
              service:
                name: core-api
                port:
                  number: 3005
