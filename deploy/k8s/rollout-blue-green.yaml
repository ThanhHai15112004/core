# ==============================================================================
# Core Framework — Kubernetes Blue-Green Rollout Profile (Phase 15.3)
# Chuyển traffic tức thì bằng cách patch Service selector `slot: blue|green`.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api-blue
  namespace: default
  labels:
    app.kubernetes.io/name: core-api
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
      slot: blue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        slot: blue
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/core/core-backend:1.0.0
          ports:
            - name: http
              containerPort: 3005
          env:
            - name: APP_DEPLOY_STRATEGY
              value: "blue-green"
            - name: APP_DEPLOY_SLOT
              value: "blue"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-api-green
  namespace: default
  labels:
    app.kubernetes.io/name: core-api
    slot: green
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: core-api
      slot: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: core-api
        slot: green
    spec:
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: api
          image: ghcr.io/core/core-backend:1.0.0
          ports:
            - name: http
              containerPort: 3005
          env:
            - name: APP_DEPLOY_STRATEGY
              value: "blue-green"
            - name: APP_DEPLOY_SLOT
              value: "green"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: core-api
  namespace: default
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: core-api
    slot: blue
  ports:
    - name: http
      port: 3005
      targetPort: http
