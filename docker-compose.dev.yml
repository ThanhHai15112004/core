name: core-framework

services:
  app:
    container_name: core-framework-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3005:3005"
      - "5175:5175"
    environment:
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker.dev
    volumes:
      # Bind mount mã nguồn từ host để hot-reload khi chỉnh sửa code
      - ./backend:/app/backend
      - ./frontend:/app/frontend
      # Giữ node_modules độc lập trong container để tránh ghi đè với host
      - backend_node_modules:/app/backend/node_modules
      - frontend_node_modules:/app/frontend/node_modules
    restart: unless-stopped

volumes:
  backend_node_modules:
  frontend_node_modules:
