name: core-framework

services:
  backend:
    container_name: core-backend-dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker.dev
    volumes:
      # Bind mount mã nguồn backend từ host để hot-reload khi chỉnh sửa code
      - ./backend:/app/backend
      # Giữ node_modules độc lập trong container để tránh ghi đè với host
      - backend_node_modules:/app/backend/node_modules
    # Giới hạn tài nguyên bộ nhớ cho Backend API Server
    mem_limit: 768m
    mem_reservation: 384m
    restart: unless-stopped

  frontend:
    container_name: core-frontend-dev
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    ports:
      - "5175:5175"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3005/api/v1
    volumes:
      # Bind mount mã nguồn frontend từ host để hot-reload khi chỉnh sửa code
      - ./frontend:/app/frontend
      # Giữ node_modules độc lập trong container để tránh ghi đè với host
      - frontend_node_modules:/app/frontend/node_modules
    # Giới hạn tài nguyên bộ nhớ cho Frontend Vite Server
    mem_limit: 384m
    mem_reservation: 192m
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
