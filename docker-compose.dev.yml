name: core-framework

services:
  backend:
    container_name: core-backend-dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    ports:
      - "3005:3005"
    environment:
      - NODE_ENV=development
      - RUNTIME=api
      - RUNTIME_SUPERVISOR=docker
      - PROMETHEUS_URL=http://prometheus:9090
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker.dev
    volumes:
      # Bind mount mã nguồn backend từ host để hot-reload khi chỉnh sửa code
      - ./backend:/app/backend
      - ./docker/backend/entrypoint.dev.sh:/app/docker/backend/entrypoint.dev.sh
      # Giữ node_modules độc lập trong container để tránh ghi đè với host
      - backend_node_modules:/app/backend/node_modules
    # Giới hạn tài nguyên bộ nhớ cho Backend API Server
    mem_limit: 1536m
    mem_reservation: 512m
    restart: unless-stopped
    networks:
      - core_dev_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3005/api/v1/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Worker runtime: consumer BullMQ (dùng dist do service backend build)
  worker:
    container_name: core-worker-dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    environment:
      - NODE_ENV=development
      - RUNTIME=worker
      - RUNTIME_SUPERVISOR=docker
      - METRICS_PORT=9101
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker.dev
    volumes:
      - ./backend:/app/backend
      - ./docker/backend/entrypoint.dev.sh:/app/docker/backend/entrypoint.dev.sh
      - backend_node_modules:/app/backend/node_modules
    mem_limit: 512m
    mem_reservation: 256m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - core_dev_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9101/metrics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Scheduler runtime: cron task (dùng dist do service backend build)
  scheduler:
    container_name: core-scheduler-dev
    build:
      context: .
      dockerfile: docker/backend/Dockerfile.dev
    environment:
      - NODE_ENV=development
      - RUNTIME=scheduler
      - RUNTIME_SUPERVISOR=docker
      - METRICS_PORT=9102
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.docker.dev
    volumes:
      - ./backend:/app/backend
      - ./docker/backend/entrypoint.dev.sh:/app/docker/backend/entrypoint.dev.sh
      - backend_node_modules:/app/backend/node_modules
    mem_limit: 256m
    mem_reservation: 128m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - core_dev_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9102/metrics >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    container_name: core-frontend-dev
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    ports:
      - "5175:5175"
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:3005/api/v1
    volumes:
      # Bind mount mã nguồn frontend từ host để hot-reload khi chỉnh sửa code
      - ./frontend:/app/frontend
      - ./docker/frontend/entrypoint.dev.sh:/app/docker/frontend/entrypoint.dev.sh
      # Giữ node_modules độc lập trong container để tránh ghi đè với host
      - frontend_node_modules:/app/frontend/node_modules
    # Giới hạn tài nguyên bộ nhớ cho Frontend Vite Server (cần đủ cho esbuild optimizer bundle ECharts, Radix UI)
    mem_limit: 1024m
    mem_reservation: 384m
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - core_dev_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5175 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Prometheus: scrape /metrics của api/worker/scheduler, nguồn lịch sử cho biểu đồ System Console
  prometheus:
    container_name: core-prometheus-dev
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    mem_limit: 256m
    restart: unless-stopped
    networks:
      - core_dev_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Volumes & Networks
# ==============================================================================
volumes:
  backend_node_modules:
    name: core_dev_backend_node_modules
  frontend_node_modules:
    name: core_dev_frontend_node_modules
  prometheus_data:
    name: core_dev_prometheus_data

networks:
  core_dev_net:
    name: core_dev_network
    driver: bridge
