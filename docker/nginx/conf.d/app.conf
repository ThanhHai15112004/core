upstream backend_upstream {
    server backend:3005;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Phục vụ ACME-challenge cho Let's Encrypt Certbot cấp phát chứng chỉ SSL
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Security headers
    include /etc/nginx/security-headers.conf;

    # Định tuyến Backend Fastify API
    location /api/ {
        # Áp dụng Rate Limiting bảo vệ API
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;

        # Truyền đúng IP người dùng thực tế qua Reverse Proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Hỗ trợ kết nối WebSocket nếu ứng dụng cần
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeout cấu hình hợp lý
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    # Phục vụ Frontend React SPA (Single Page Application)
    location / {
        root /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache lâu dài cho các tài nguyên tĩnh đã gắn hash nội dung
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Tránh cache file index.html để client luôn nhận bản cập nhật mới nhất
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }
    }
}
