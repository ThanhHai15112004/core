user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Định dạng Log chi tiết bao gồm thời gian phản hồi và request_id
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rid="$request_id" rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Tối ưu hóa I/O và kết nối mạng
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    # Keep-alive LB phải nhỏ hơn API_KEEP_ALIVE_TIMEOUT_MS (65s) để tránh lỗi 502 race
    keepalive_timeout 60s;
    types_hash_max_size 2048;
    server_tokens off;

    # Giữ HTTP/1.1 keepalive với upstream khi không phải WebSocket upgrade
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' '';
    }

    # Giới hạn kích thước body đồng nhất với Backend API_MAX_BODY_SIZE_BYTES (32MB)
    client_max_body_size 32M;
    client_body_buffer_size 128k;

    # Bật nén Gzip tối ưu tốc độ tải trang và giảm băng thông
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Giới hạn tốc độ truy cập tầng Edge/Gateway (Rate Limiting) theo IP
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # Nạp upstream (hỗ trợ Rolling / Blue-Green / Canary) và các virtual hosts
    include /etc/nginx/upstreams/*.conf;
    include /etc/nginx/conf.d/*.conf;
}
