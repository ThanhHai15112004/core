# ==============================================================================
# Security Headers tiêu chuẩn cho Production (OWASP Recommended)
# ==============================================================================

# Ngăn chặn clickjacking bằng cách cấm nhúng iframe từ domain khác
add_header X-Frame-Options "SAMEORIGIN" always;

# Ngăn chặn trình duyệt đoán sai MIME type (chống MIME confusion attacks)
add_header X-Content-Type-Options "nosniff" always;

# Bật bộ lọc XSS của trình duyệt cũ
add_header X-XSS-Protection "1; mode=block" always;

# Kiểm soát thông tin Referrer khi chuyển trang
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Giới hạn các tính năng phần cứng nhạy cảm
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
